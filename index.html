<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>速写本 · Weekly Log</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f7f3e8'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23b5432e' font-family='Songti SC, SimSun, serif' font-weight='900'%3E速%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --paper: #f7f3e8;
    --paper-deep: #efe9d8;
    --ink: #2f2a24;
    --ink-2: #6b6355;
    --ink-3: #a89d8a;
    --seal: #b5432e;
    --seal-soft: rgba(181, 67, 46, .12);
    --rule: #ddd4bf;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--serif);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.8;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,252,240,.9), transparent),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(214,200,170,.25), transparent);
    pointer-events: none;
    z-index: -1;
  }

  .wrap {
    max-width: 660px;
    margin: 0 auto;
    padding: clamp(32px, 7vw, 72px) clamp(20px, 5vw, 28px) 100px;
  }

  /* ===== 报头 ===== */
  header.masthead { margin-bottom: clamp(40px, 7vw, 64px); }
  .masthead-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  .brand {
    font-size: clamp(30px, 6vw, 42px);
    font-weight: 900;
    letter-spacing: .12em;
  }
  .brand .dot { color: var(--seal); }
  .masthead-meta {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .tagline {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 3px double var(--rule);
    color: var(--ink-2);
    font-size: 14.5px;
  }

  /* ===== 搜索 ===== */
  .search { position: relative; margin-bottom: 8px; }
  .search input {
    width: 100%;
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 8px 2px 8px 26px;
    outline: none;
    transition: border-color .2s;
  }
  .search input:focus { border-color: var(--seal); }
  .search input::placeholder { color: var(--ink-3); }
  .search svg {
    position: absolute;
    left: 2px; top: 12px;
    color: var(--ink-3);
    pointer-events: none;
  }

  /* ===== 目录列表 ===== */
  .index-list { margin-top: 28px; }
  .entry {
    display: grid;
    grid-template-columns: 118px 1fr;
    gap: 20px;
    padding: 26px 4px 24px;
    border-bottom: 1px dashed var(--rule);
    text-decoration: none;
    color: var(--ink);
    transition: background .15s;
  }
  .entry:hover .entry-title { color: var(--seal); }
  .entry:hover .entry-date { color: var(--seal); }
  .entry-date {
    font-size: 15px;
    color: var(--ink-2);
    letter-spacing: .04em;
    line-height: 1.5;
  }
  .entry-date .yr { font-size: 12px; color: var(--ink-3); }
  .entry-no {
    display: block;
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 4px;
    letter-spacing: .2em;
  }
  .entry-body { min-width: 0; }
  .entry-title {
    font-size: 18.5px;
    font-weight: 700;
    line-height: 1.5;
    transition: color .15s;
  }
  .entry-excerpt {
    margin-top: 6px;
    font-size: 14px;
    color: var(--ink-2);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }

  .empty {
    display: none;
    text-align: center;
    color: var(--ink-3);
    padding: 56px 0;
    font-size: 14px;
  }
  .empty::before { content: "（ "; }
  .empty::after  { content: " ）"; }

  /* ===== 文章视图 ===== */
  .back {
    display: inline-block;
    font-size: 13px;
    color: var(--ink-2);
    text-decoration: none;
    margin-bottom: 34px;
    letter-spacing: .08em;
  }
  .back:hover { color: var(--seal); }
  .back::before { content: "← "; }

  article.post { animation: fadein .3s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }

  .post-head { margin-bottom: 36px; }
  .post-date {
    font-size: 13px;
    color: var(--seal);
    letter-spacing: .18em;
  }
  .post-title {
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 900;
    line-height: 1.4;
    margin-top: 8px;
  }
  .post-rule {
    margin-top: 18px;
    height: 3px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  /* ===== 正文排版（方案 A，修正版） ===== */
  .post-body { font-size: 16px; }
  .post-body > * { margin-bottom: 1.1em; }
  .post-body > *:last-child { margin-bottom: 0; }

  /* 段落：首行缩进两字 + 中文两端对齐 */
  .post-body p {
    text-indent: 2em;
    text-align: justify;
    text-justify: inter-ideograph;
  }
  .post-body p:first-child,
  .post-body p:has(> img),
  .post-body img { text-indent: 0; }
  .post-body p img { display: inline-block; }

  /* 标题：仅朱砂侧线，无序号 */
  .post-body h2 {
    font-size: 18.5px;
    font-weight: 700;
    margin: 1.8em 0 .9em;
    padding-left: 12px;
    border-left: 3px solid var(--seal);
    line-height: 1.5;
  }
  .post-body h2:first-child { margin-top: .4em; }
  .post-body h3 {
    font-size: 16.5px;
    font-weight: 700;
    margin: 1.5em 0 .8em;
  }

  /* 列表：朱砂菱形符号 */
  .post-body ol { padding-left: 1.5em; }
  .post-body ul {
    padding-left: 1.55em;
    list-style: none;
  }
  .post-body ul > li { position: relative; }
  .post-body ul > li::before {
    content: '';
    position: absolute;
    left: 0; top: .78em;
    width: 5px; height: 5px;
    border-radius: 1px;
    transform: rotate(45deg);
    background: var(--seal);
    opacity: .55;
  }
  .post-body li {
    margin-bottom: .45em;
    text-indent: 0;
    text-align: left;
  }
  .post-body li:last-child { margin-bottom: 0; }

  /* 引用块：横向渐变 + 竖排「题记」 */
  .post-body blockquote {
    position: relative;
    max-width: 90%;
    margin: 1.3em auto;
    padding: 10px 22px 10px 20px;
    border-left: 2px solid var(--seal);
    color: var(--ink-2);
    background: linear-gradient(90deg, var(--paper-deep), rgba(239,233,216,0) 80%);
  }
  .post-body blockquote p {
    text-indent: 0;
    text-align: left;
    margin-bottom: .3em;
  }
  .post-body blockquote p:last-child { margin-bottom: 0; }
  .post-body blockquote::after {
    content: '题记';
    writing-mode: vertical-rl;
    position: absolute;
    right: 4px; top: 10px;
    font-size: 10px;
    line-height: 1;
    letter-spacing: .4em;
    color: var(--seal);
    opacity: .55;
  }

  /* 链接、图片、代码 */
  .post-body a {
    color: var(--seal);
    text-decoration: none;
    border-bottom: 1px solid var(--seal-soft);
    transition: border-color .15s;
    word-break: break-all;
  }
  .post-body a:hover { border-color: var(--seal); }
  .post-body img {
    max-width: 100%;
    border-radius: 8px;
    border: 1px solid var(--rule);
    display: block;
    margin: 1.4em auto;
  }
  .post-body p:has(> img:only-child) { text-align: center; }
  .post-body code {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: .88em;
    background: var(--paper-deep);
    padding: 2px 6px;
    border-radius: 4px;
    word-break: break-all;
  }
  .post-body pre {
    background: #2c2820;
    color: #e9e2d0;
    padding: 16px 18px;
    border-radius: 8px;
    overflow-x: auto;
    line-height: 1.6;
    font-size: 13.5px;
  }
  .post-body pre code { background: none; padding: 0; color: inherit; }
  .post-body hr {
    border: none;
    height: 3px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    margin: 2.2em 0;
  }
  .post-body del { color: var(--ink-3); }

  /* 图床失效兜底 */
  .img-broken {
    padding: 18px;
    border: 1px dashed var(--rule);
    background: var(--paper-deep);
    color: var(--ink-3);
    font-size: 13px;
    text-align: center;
    border-radius: 8px;
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(30, 25, 18, .93);
    display: none;
    place-items: center;
    z-index: 999;
    cursor: zoom-out;
  }
  .lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }

  .post-nav {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 14px;
  }
  .post-nav a {
    color: var(--ink-2);
    text-decoration: none;
    max-width: 46%;
    line-height: 1.6;
  }
  .post-nav a:hover { color: var(--seal); }
  .post-nav .lbl {
    display: block;
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--ink-3);
    margin-bottom: 2px;
  }
  .post-nav .next { text-align: right; margin-left: auto; }

  footer.colophon {
    margin-top: 80px;
    padding-top: 22px;
    border-top: 3px double var(--rule);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: .08em;
  }

  @media (max-width: 560px) {
    .entry { grid-template-columns: 1fr; gap: 6px; }
    .entry-date { display: flex; align-items: baseline; gap: 10px; }
    .entry-no { margin-top: 0; }
    .post-nav { flex-direction: column; }
    .post-nav a { max-width: 100%; }
    .post-nav .next { text-align: left; margin-left: 0; }
    .post-body blockquote { max-width: 100%; }
    .post-body blockquote::after { right: 2px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">

  <header class="masthead">
    <div class="masthead-row">
      <div class="brand">速写本<span class="dot">。</span></div>
      <div class="masthead-meta" id="range"></div>
    </div>
    <p class="tagline">一周一页：看了什么、读了什么、想到什么。不成文章，只是速写。</p>
  </header>

  <div id="view"></div>

  <footer class="colophon">
    <span>© <span id="year"></span> vestjin</span>
    <span>纸上得来终觉浅</span>
  </footer>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lb"><img id="lbImg" alt=""></div>

<script>
/* entries.txt 每行一个日期（即 posts/ 下的文件名），新 → 旧 */

/* 围栏标记（反引号 x3），用转义写法避免源码里出现连续反引号 */
const FENCE = '\u0060\u0060\u0060';

const $ = id => document.getElementById(id);
let entries = [];
let byId = {};

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function inline(s) {
  return s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,
      '<img src="$2" alt="$1" loading="lazy" decoding="async" referrerpolicy="no-referrer">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>');
}

function renderMD(src) {
  const blocks = [];
  const rx = new RegExp(FENCE + '[^\\n]*\\n([\\s\\S]*?)' + FENCE, 'g');
  src = src.replace(rx, (m, code) => {
    blocks.push(code);
    return '\u0000CODE' + (blocks.length - 1) + '\u0000';
  });

  const lines = esc(src).split('\n');
  let html = '', list = null, quote = null, para = [];

  const flushPara = () => {
    if (para.length) { html += '<p>' + inline(para.join('<br>')) + '</p>'; para = []; }
  };
  const flushAll = () => {
    if (list) { html += '</' + list + '>'; list = null; }
    if (quote) { html += '</blockquote>'; quote = null; }
    flushPara();
  };

  for (let line of lines) {
    const codeM = line.match(/^\u0000CODE(\d+)\u0000$/);
    if (codeM) {
      flushAll();
      html += '<pre><code>' + esc(blocks[+codeM[1]]) + '</code></pre>';
      continue;
    }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) {
      flushAll();
      const l = h[1].length;
      html += '<h' + l + '>' + inline(h[2]) + '</h' + l + '>';
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushAll(); html += '<hr>'; continue; }

    const q = line.match(/^>\s?(.*)/);
    if (q) {
      flushPara();
      if (list) { html += '</' + list + '>'; list = null; }
      if (!quote) { html += '<blockquote>'; quote = true; }
      html += '<p>' + inline(q[1]) + '</p>';
      continue;
    }
    if (quote) { html += '</blockquote>'; quote = false; }

    const ul = line.match(/^\s*[-*]\s+(.*)/);
    const ol = line.match(/^\s*\d+\.\s+(.*)/);
    if (ul || ol) {
      flushPara();
      const tag = ul ? 'ul' : 'ol';
      if (list !== tag) {
        if (list) html += '</' + list + '>';
        html += '<' + tag + '>';
        list = tag;
      }
      html += '<li>' + inline((ul || ol)[1]) + '</li>';
      continue;
    }
    if (list) { html += '</' + list + '>'; list = null; }

    if (!line.trim()) { flushPara(); continue; }
    para.push(line.trim());
  }
  flushAll();
  return html;
}

function parseEntry(id, raw, idx) {
  const lines = raw.split('\n');
  let title = '无题', start = 0;
  const m = lines[0] && lines[0].match(/^#\s+(.*)/);
  if (m) { title = m[1].trim(); start = 1; }
  /* 正文从标题之后开始：md 首行标题只显示在页头，不进正文，避免重复 */
  const body = lines.slice(start).join('\n').replace(/^\s+/, '');

  let excerpt = '';
  for (let i = start; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) continue;
    if (t.startsWith('#')) continue;
    excerpt = t.replace(/^>\s?/, '').replace(/[*`>~\[\]!]/g, '').slice(0, 90);
    break;
  }
  return { id, title, excerpt, date: id, no: '第 ' + String(idx + 1) + ' 期', body: body };
}

function fmtDate(id) {
  const parts = id.split('-');
  return '<span class="yr">' + parts[0] + '</span> ' + parts[1] + '.' + parts[2];
}
function fmtDateFull(id) {
  return id.replace(/-/g, ' · ');
}

function showIndex(kw) {
  kw = (kw || '').trim().toLowerCase();
  const shown = kw
    ? entries.filter(e => (e.title + ' ' + e.excerpt + ' ' + e.body).toLowerCase().includes(kw))
    : entries;

  let html =
    '<div class="search">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      '<input type="search" id="q" placeholder="翻找旧页…" autocomplete="off" value="' + esc(kw || '') + '">' +
    '</div>' +
    '<div class="index-list">';

  for (const e of shown) {
    html +=
      '<a class="entry" href="#/' + e.id + '">' +
        '<div class="entry-date">' + fmtDate(e.date) + '<span class="entry-no">' + e.no + '</span></div>' +
        '<div class="entry-body">' +
          '<div class="entry-title">' + esc(e.title) + '</div>' +
          (e.excerpt ? '<div class="entry-excerpt">' + esc(e.excerpt) + '…</div>' : '') +
        '</div>' +
      '</a>';
  }
  html += '</div>' +
    '<div class="empty" id="empty" style="display:' + (shown.length ? 'none' : 'block') + '">没有找到这一页</div>';

  $('view').innerHTML = html;
  const input = $('q');
  if (input) input.addEventListener('input', () => showIndex(input.value));
}

function showPost(id) {
  const e = byId[id];
  if (!e) {
    $('view').innerHTML =
      '<p class="empty" style="display:block">这一页好像被撕掉了 <a href="#" onclick="location.hash=\'\';return false" style="color:var(--seal)">回目录</a></p>';
    return;
  }
  const idx = entries.indexOf(e);
  const prev = entries[idx + 1];
  const next = entries[idx - 1];

  $('view').innerHTML =
    '<a class="back" href="#">← 回目录</a>' +
    '<article class="post">' +
      '<div class="post-head">' +
        '<div class="post-date">' + e.no + ' · ' + fmtDateFull(e.date) + '</div>' +
        '<h1 class="post-title">' + esc(e.title) + '</h1>' +
        '<div class="post-rule"></div>' +
      '</div>' +
      '<div class="post-body">' + renderMD(e.body) + '</div>' +
      '<nav class="post-nav">' +
        (prev
          ? '<a class="prev" href="#/' + prev.id + '"><span class="lbl">← 更早</span>' + esc(prev.title) + '</a>'
          : '<span></span>') +
        (next
          ? '<a class="next" href="#/' + next.id + '"><span class="lbl">更新 →</span>' + esc(next.title) + '</a>'
          : '') +
      '</nav>' +
    '</article>';

  $('view').querySelectorAll('.post-body img').forEach(img => {
    img.style.cursor = 'zoom-in';
    img.onerror = () => {
      const d = document.createElement('div');
      d.className = 'img-broken';
      d.textContent = '〔图已失效' + (img.alt ? '：' + img.alt : '') + '〕';
      img.replaceWith(d);
    };
    img.onclick = () => { lbImg.src = img.src; lb.style.display = 'grid'; };
  });

  window.scrollTo(0, 0);
}

function route() {
  const m = location.hash.match(/^#\/([\w-]+)$/);
  if (m) showPost(m[1]);
  else showIndex('');
}

window.addEventListener('hashchange', route);

const lb = $('lb'), lbImg = $('lbImg');
lb.onclick = () => lb.style.display = 'none';
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') lb.style.display = 'none';
});

fetch('entries.txt')
  .then(r => r.text())
  .then(txt => {
    const ids = txt.split('\n').map(s => s.trim()).filter(Boolean);
    return Promise.all(ids.map(id =>
      fetch('posts/' + id + '.md')
        .then(r => r.ok ? r.text() : Promise.reject(id))
        .then(raw => ({ id, raw }))
        .catch(() => null)
    ));
  })
  .then(list => {
    entries = list.filter(Boolean).map((x, i) => parseEntry(x.id, x.raw, i));
    byId = Object.fromEntries(entries.map(e => [e.id, e]));

    if (entries.length) {
      $('range').textContent =
        entries[entries.length - 1].date + ' — ' + entries[0].date;
    }
    route();
  })
  .catch(() => {
    $('view').innerHTML = '<p class="empty" style="display:block">速写本还是空的</p>';
  });

$('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
