name: build-and-deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'posts/**'
      - 'entries.txt'
      - 'build.js'
      - 'template.md'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 生成 posts-data.js 和 feed.xml
        run: node build.js https://www.jinmajue.top/journal
      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4