<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>速写本 · Weekly Log</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f7f3e8'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23b5432e' font-family='Songti SC, SimSun, serif' font-weight='900'%3E速%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --paper: #f7f3e8;
    --page: #fcf9f1;
    --paper-deep: #efe9d8;
    --ink: #2f2a24;
    --ink-2: #6b6355;
    --ink-3: #a89d8a;
    --seal: #b5432e;
    --seal-soft: rgba(181, 67, 46, .12);
    --rule: #ddd4bf;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--serif);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.8;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,252,240,.9), transparent),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(214,200,170,.25), transparent);
    pointer-events: none;
    z-index: -1;
  }

  .wrap {
    max-width: 660px;
    margin: 0 auto;
    padding: clamp(32px, 7vw, 72px) clamp(20px, 5vw, 28px) 100px;
  }

  /* ===== 报头 ===== */
  header.masthead { margin-bottom: clamp(40px, 7vw, 64px); }
  .masthead-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  .brand {
    font-size: clamp(30px, 6vw, 42px);
    font-weight: 900;
    letter-spacing: .12em;
  }
  .brand .dot { color: var(--seal); }
  .masthead-meta {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .tagline {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 3px double var(--rule);
    color: var(--ink-2);
    font-size: 14.5px;
  }

  /* ===== 搜索 ===== */
  .search { position: relative; margin-bottom: 8px; }
  .search input {
    width: 100%;
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 8px 2px 8px 26px;
    outline: none;
    transition: border-color .2s;
  }
  .search input:focus { border-color: var(--seal); }
  .search input::placeholder { color: var(--ink-3); }
  .search svg {
    position: absolute;
    left: 2px; top: 12px;
    color: var(--ink-3);
    pointer-events: none;
  }

  /* ===== 目录列表 ===== */
  .index-list { margin-top: 28px; }
  .entry {
    display: grid;
    grid-template-columns: 118px 1fr;
    gap: 20px;
    padding: 26px 4px 24px;
    border-bottom: 1px dashed var(--rule);
    text-decoration: none;
    color: var(--ink);
  }
  .entry:hover .entry-title { color: var(--seal); }
  .entry:hover .entry-date { color: var(--seal); }
  .entry-date {
    font-size: 15px;
    color: var(--ink-2);
    letter-spacing: .04em;
    line-height: 1.5;
  }
  .entry-date .yr { font-size: 12px; color: var(--ink-3); }
  .entry-no {
    display: block;
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 4px;
    letter-spacing: .2em;
  }
  .entry-body { min-width: 0; }
  .entry-title {
    font-size: 18.5px;
    font-weight: 700;
    line-height: 1.5;
    transition: color .15s;
  }
  .entry-excerpt {
    margin-top: 6px;
    font-size: 14px;
    color: var(--ink-2);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  /* ===== 最新一期高亮 ===== */
  .entry-latest {
    background: var(--page);
    border: 1px solid var(--rule);
    outline: 1px solid var(--rule);
    outline-offset: 4px;
    padding: 24px 18px 22px;
    margin-bottom: 12px;
    box-shadow: 0 10px 26px -18px rgba(70, 55, 32, .45);
  }
  .entry-latest .entry-title { color: var(--seal); }
  .badge-new {
    display: inline-block;
    font-size: 10.5px;
    letter-spacing: .18em;
    color: var(--seal);
    border: 1px solid var(--seal);
    border-radius: 2px;
    padding: 1px 6px 1px 8px;
    margin-left: 10px;
    vertical-align: 2px;
  }

  /* ===== 分页 ===== */
  .pager {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 30px;
  }
  .pager button {
    font-family: var(--serif);
    font-size: 13.5px;
    color: var(--ink-2);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 6px 16px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .pager button:hover:not(:disabled) { color: var(--seal); border-color: var(--seal); }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pg-info { color: var(--ink-3); font-size: 12.5px; letter-spacing: .1em; }

  .empty {
    display: none;
    text-align: center;
    color: var(--ink-3);
    padding: 56px 0;
    font-size: 14px;
  }
  .empty::before { content: "（ "; }
  .empty::after  { content: " ）"; }

  /* ===== 文章视图 ===== */
  .back {
    display: inline-block;
    font-size: 13px;
    color: var(--ink-2);
    text-decoration: none;
    margin-bottom: 30px;
    letter-spacing: .08em;
  }
  .back:hover { color: var(--seal); }
  .back::before { content: "← "; }

  article.post { animation: fadein .3s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }

  .post-head { margin-bottom: 30px; }
  .post-date {
    font-size: 13px;
    color: var(--seal);
    letter-spacing: .18em;
  }
  .post-title {
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 900;
    line-height: 1.4;
    margin-top: 8px;
  }

  /* ===== 正文：书页卡片 ===== */
  .post-body {
    font-size: 16px;
    background: var(--page);
    border: 1px solid var(--rule);
    outline: 1px solid var(--rule);
    outline-offset: 5px;
    padding: clamp(26px, 6vw, 46px) clamp(22px, 6vw, 42px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 14px 34px -20px rgba(70, 55, 32, .45);
  }
  .post-body > * { margin-bottom: 1.05em; }
  .post-body > *:last-child { margin-bottom: 0; }

  /* 段落：首行缩进 + 两端对齐；开场段首字下沉 */
  .post-body p {
    text-indent: 2em;
    text-align: justify;
    text-justify: inter-ideograph;
  }
  .post-body p:first-child,
  .post-body p:has(> img) { text-indent: 0; }
  .post-body > p:first-child::first-letter {
    float: left;
    font-size: 2.5em;
    line-height: 1;
    font-weight: 900;
    color: var(--seal);
    padding: .04em .1em 0 0;
  }
  .post-body > p:first-child:has(img)::first-letter,
  .post-body > p:has(> a:first-child)::first-letter { all: revert; }

  /* h2：居中 + 两侧双边饰线 */
  .post-body h2 {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .18em;
    margin: 2em 0 1em;
    text-indent: 0;
  }
  .post-body h2:first-child { margin-top: .3em; }
  .post-body h2::before,
  .post-body h2::after {
    content: '';
    flex: 1;
    height: 3px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  /* h3：行首朱砂菱形 */
  .post-body h3 {
    position: relative;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .06em;
    margin: 1.6em 0 .8em;
    padding-left: 18px;
  }
  .post-body h3::before {
    content: '';
    position: absolute;
    left: 0; top: .55em;
    width: 7px; height: 7px;
    transform: rotate(45deg);
    background: var(--seal);
  }

  /* h4：细虚线下划 + 行首小圆点 */
  .post-body h4 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .05em;
    color: var(--ink);
    margin: 1.4em 0 .7em;
    padding-bottom: .35em;
    border-bottom: 1px dashed var(--rule);
  }
  .post-body h4::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--seal);
    opacity: .65;
    margin-right: .55em;
    vertical-align: 2px;
  }

  /* ==========================================================
     列表体系（纯 CSS）
     —— 一级是墨，二级是铅笔 ——
     ========================================================== */

  /* ul 基础：缩进由 li 自己出 */
  .post-body ul {
    padding-left: .2em;
    list-style: none;
  }
  .post-body ul > li {
    position: relative;
    padding-left: 1.35em;
  }
  .post-body ul > li::before {
    content: '';
    position: absolute;
    left: 0; top: .78em;
    width: 5px; height: 5px;
    border-radius: 1px;
    transform: rotate(45deg);
    background: var(--seal);
    opacity: .55;
  }

  /* ol 基础：中文数字 */
  .post-body ol {
    padding-left: 2.3em;
    list-style: cjk-ideographic;
  }
  .post-body ol li::marker {
    color: var(--seal);
    font-weight: 700;
  }

  /* li 基础 */
  .post-body li {
    margin-bottom: .45em;
    text-indent: 0;
    text-align: left;
  }
  .post-body li:last-child { margin-bottom: 0; }

  /* 带链接的条目（即「- [标题](url) — 一句短评」）
     用 :has 识别，整条进入「短评体」：淡墨、略小
     链接（标题）则回到墨色、加粗、铅笔细线 */
  .post-body li:has(> a:first-child) {
    color: var(--ink-2);
    font-size: .93em;
    line-height: 1.7;
  }
  .post-body li:has(> a:first-child) > a:first-child {
    color: var(--ink);
    font-weight: 700;
    font-size: 1.08em;               /* 抵消 li 的缩小，回到正文级 */
    border-bottom: 1px solid var(--rule);
    transition: color .15s, border-color .15s;
  }
  .post-body li:has(> a:first-child) > a:first-child:hover {
    color: var(--seal);
    border-bottom-color: var(--seal-soft);
  }
  /* 兼容不支持 :has 的浏览器 */
  @supports not (selector(:has(*))) {
    .post-body li > a:first-child {
      font-weight: 700;
      border-bottom: 1px solid var(--rule);
    }
  }

  /* 嵌套子列表：虚线导轨 + 更小菱形 + 更淡文字 */
  .post-body ul ul,
  .post-body ol ul {
    list-style: none;
    margin: .4em 0 .15em;
    padding-left: 1.15em;
    margin-left: .55em;
    border-left: 1px dashed var(--rule);
  }
  .post-body ul ul > li,
  .post-body ol ul > li {
    position: relative;
    padding-left: 1.2em;
    font-size: .94em;
    color: var(--ink-3);
  }
  .post-body ul ul > li::before,
  .post-body ol ul > li::before {
    content: '';
    position: absolute;
    left: 0; top: .82em;
    width: 4px; height: 4px;
    border-radius: 1px;
    transform: rotate(45deg);
    background: var(--seal);
    opacity: .35;
  }
  /* 子列表里的链接：淡墨，不打断二级的弱化层级 */
  .post-body ul ul > li a,
  .post-body ol ul > li a {
    color: var(--ink-2);
    font-weight: 400;
    border-bottom: 1px solid var(--rule);
  }

  /* 长评段：嵌套列表里的 * 条目，无菱形、成段排版 */
  .post-body ul ul > li.prose::before,
  .post-body ol ul > li.prose::before { content: none; }
  .post-body ul ul > li.prose,
  .post-body ol ul > li.prose {
    padding-left: 0;
    margin-bottom: .6em;
    text-align: justify;
    line-height: 1.75;
    font-size: .92em;
  }

  /* 嵌套有序子列表：普通阿拉伯数字，与主列表的中文数字区分 */
  .post-body ul ol,
  .post-body ol ol {
    list-style: decimal;
    font-size: .94em;
    color: var(--ink-2);
    margin: .4em 0 .15em;
    padding-left: 1.8em;
  }
  .post-body ul ol li::marker { font-weight: 400; opacity: .8; }

  /* 强调：着重号（中文式点标注） */
  .post-body em {
    font-style: normal;
    text-emphasis: filled circle var(--seal);
    -webkit-text-emphasis: filled circle var(--seal);
    text-emphasis-position: under right;
    -webkit-text-emphasis-position: under right;
  }
  .post-body strong { font-weight: 700; color: var(--ink); }

  /* mark：荧光笔划过 */
  .post-body mark {
    background: linear-gradient(to top,
      rgba(214, 178, 90, .45) 45%, transparent 45%);
    color: inherit;
    padding: 0 .1em;
  }

  /* kbd：按键 */
  .post-body kbd {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: .82em;
    color: var(--ink-2);
    background: var(--page);
    border: 1px solid var(--rule);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    margin: 0 .15em;
  }

  /* 引用：「」角标引文 */
  .post-body blockquote {
    position: relative;
    max-width: 88%;
    margin: 1.4em auto;
    padding: 8px 26px;
    color: var(--ink-2);
    text-align: center;
  }
  .post-body blockquote::before {
    content: '「';
    position: absolute;
    left: 0; top: 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--seal);
  }
  .post-body blockquote::after {
    content: '」';
    position: absolute;
    right: 0; bottom: 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--seal);
  }
  .post-body blockquote p {
    text-indent: 0;
    text-align: center;
    margin-bottom: .3em;
  }
  .post-body blockquote p:last-child { margin-bottom: 0; }

  /* 链接、图片、代码 */
  .post-body a {
    color: var(--seal);
    text-decoration: none;
    border-bottom: 1px solid var(--seal-soft);
    transition: border-color .15s;
    word-break: break-all;
  }
  .post-body a:hover { border-color: var(--seal); }
  .post-body img {
    max-width: 100%;
    display: block;
    margin: 1.4em auto;
    border: 8px solid #fff;
    outline: 1px solid var(--rule);
    box-shadow: 0 8px 20px -12px rgba(70, 55, 32, .5);
  }
  .post-body p:has(> img:only-child) { text-align: center; }
  .post-body code {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: .88em;
    background: var(--paper-deep);
    padding: 2px 6px;
    border-radius: 4px;
    word-break: break-all;
  }
  .post-body pre {
    background: #2c2820;
    color: #e9e2d0;
    padding: 16px 18px;
    border-radius: 6px;
    overflow-x: auto;
    line-height: 1.6;
    font-size: 13.5px;
  }
  .post-body pre code { background: none; padding: 0; color: inherit; }

  /* 表格：纸面账目风 */
  .post-body table {
    width: 100%;
    border-collapse: collapse;
    font-size: .92em;
    margin: 1.4em 0;
  }
  .post-body th {
    font-weight: 700;
    text-align: left;
    color: var(--ink);
    border-bottom: 2px solid var(--rule);
    padding: .5em .7em;
    letter-spacing: .05em;
  }
  .post-body td {
    color: var(--ink-2);
    border-bottom: 1px dashed var(--rule);
    padding: .5em .7em;
  }
  .post-body tr:last-child td { border-bottom: none; }
  .post-body tbody tr:hover td { background: var(--paper-deep); }

  /* 图注 figure / figcaption */
  .post-body figure { margin: 1.6em 0; }
  .post-body figure img { margin: 0 auto; }
  .post-body figcaption {
    margin-top: .7em;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-3);
    letter-spacing: .1em;
    text-indent: 0;
  }
  .post-body figcaption::before { content: "◈ "; color: var(--seal); opacity: .55; }

  /* 脚注区 */
  .post-body .footnotes {
    margin-top: 2.2em;
    padding-top: 1em;
    border-top: 1px dashed var(--rule);
    font-size: .86em;
    color: var(--ink-2);
  }
  .post-body .footnotes h2,
  .post-body .footnotes h3 { font-size: .9em; margin: .4em 0 .6em; }
  .post-body sup a { font-size: .8em; border-bottom: none; }
  .post-body li:target,
  .post-body p:target { background: var(--seal-soft); border-radius: 3px; }

  /* 折叠块 details / summary */
  .post-body details {
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: .6em 1em;
    background: var(--paper-deep);
  }
  .post-body summary {
    cursor: pointer;
    font-weight: 700;
    font-size: .94em;
    color: var(--ink);
    letter-spacing: .04em;
  }
  .post-body summary:hover { color: var(--seal); }
  .post-body details[open] summary { margin-bottom: .5em; }
  .post-body details > *:last-child { margin-bottom: 0; }

  /* 任务清单：勾选框换成朱砂色 */
  .post-body input[type="checkbox"] { accent-color: var(--seal); margin-right: .45em; }
  .post-body li:has(> input[type="checkbox"]) { list-style: none; padding-left: .2em; }
  .post-body li:has(> input[type="checkbox"])::before { content: none; }
  .post-body li.task::before { content: none; }
  .post-body li.task { padding-left: .2em; }

  /* hr：居中花饰 */
  .post-body hr {
    border: none;
    height: auto;
    margin: 2.2em 0;
    text-align: center;
  }
  .post-body hr::after {
    content: '❦';
    display: block;
    color: var(--seal);
    opacity: .55;
    font-size: 15px;
    line-height: 1;
  }
  .post-body del { color: var(--ink-3); }

  /* 图床失效兜底 */
  .img-broken {
    padding: 18px;
    border: 1px dashed var(--rule);
    background: var(--paper-deep);
    color: var(--ink-3);
    font-size: 13px;
    text-align: center;
    border-radius: 6px;
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(30, 25, 18, .93);
    display: none;
    place-items: center;
    z-index: 999;
    cursor: zoom-out;
  }
  .lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }

  .post-nav {
    margin-top: 44px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 14px;
  }
  .post-nav a {
    color: var(--ink-2);
    text-decoration: none;
    max-width: 46%;
    line-height: 1.6;
  }
  .post-nav a:hover { color: var(--seal); }
  .post-nav .lbl {
    display: block;
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--ink-3);
    margin-bottom: 2px;
  }
  .post-nav .next { text-align: right; margin-left: auto; }

  footer.colophon {
    margin-top: 80px;
    padding-top: 22px;
    border-top: 3px double var(--rule);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: .08em;
  }

  @media (max-width: 560px) {
    .entry { grid-template-columns: 1fr; gap: 6px; }
    .entry-date { display: flex; align-items: baseline; gap: 10px; }
    .entry-no { margin-top: 0; }
    .post-nav { flex-direction: column; }
    .post-nav a { max-width: 100%; }
    .post-nav .next { text-align: left; margin-left: 0; }
    .post-body blockquote { max-width: 100%; padding: 8px 22px; }
  }
</style>

</head>
<body>
<div class="wrap" id="app">

  <header class="masthead">
    <div class="masthead-row">
      <div class="brand">速写本<span class="dot">。</span></div>
      <div class="masthead-meta" id="range"></div>
    </div>
    <p class="tagline">一周一页：看了什么、读了什么、想到什么。不成文章，只是速写。</p>
  </header>

  <div id="view"></div>

  <footer class="colophon">
    <span>© <span id="year"></span> vestjin</span>
    <span>纸上得来终觉浅</span>
  </footer>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lb"><img id="lbImg" alt=""></div>

<script>
/* entries.txt 每行一个日期（即 posts/ 下的文件名），新 → 旧 */

/* 围栏标记（反引号 x3），用转义写法避免源码里出现连续反引号 */
const FENCE = '\u0060\u0060\u0060';

const $ = id => document.getElementById(id);
let entries = [];
const PAGE_SIZE = 5;
let byId = {};

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ================= Markdown 渲染 ================= */
function inline(s) {
  return s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,
      '<img src="$2" alt="$1" loading="lazy" decoding="async" referrerpolicy="no-referrer">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/~~([^~]+)~~|～～([^～]+)～～/g, (m, a, b) => '<del>' + (a || b) + '</del>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
}

function renderMD(src) {
  const FENCE = '\u0060\u0060\u0060';
  const blocks = [];
  const rx = new RegExp(FENCE + '[^\\n]*\\n([\\s\\S]*?)' + FENCE, 'g');
  src = src.replace(rx, (m, code) => {
    blocks.push(code);
    return '\u0000CODE' + (blocks.length - 1) + '\u0000';
  });

  /* ── <figure>：解析为 图片 + 图注 ── */
  const htmls = [];
  src = src.replace(/<figure>\s*\n?([\s\S]*?)<\/figure>/gi, (m, inner) => {
    const imgM = inner.match(/<img\s[^>]*?src="([^"]*)"[^>]*>/i);
    const capM = inner.match(/<figcaption>([\s\S]*?)<\/figcaption>/i);
    let alt = '';
    if (imgM) { const a = imgM[0].match(/alt="([^"]*)"/i); alt = a ? a[1] : ''; }
    let h = '<figure>';
    if (imgM) h += '<img src="' + imgM[1] + '" alt="' + esc(alt) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer">';
    if (capM) h += '<figcaption>' + inline(esc(capM[1].trim())) + '</figcaption>';
    h += '</figure>';
    htmls.push(h);
    return '\u0000HTML' + (htmls.length - 1) + '\u0000';
  });

  /* ── <details>：内部内容递归渲染 ── */
  src = src.replace(/<details>([\s\S]*?)<\/details>/gi, (m, inner) => {
    const sumM = inner.match(/<summary>([\s\S]*?)<\/summary>/i);
    const body = inner.replace(/<summary>[\s\S]*?<\/summary>/i, '');
    const sum = sumM ? esc(sumM[1].trim()) : '展开';
    htmls.push('<details><summary>' + sum + '</summary>' + renderMD(body.trim()) + '</details>');
    return '\u0000HTML' + (htmls.length - 1) + '\u0000';
  });

  const lines = esc(src).split('\n');
  let out = '';
  let stack = [];      /* 列表栈：{tag, indent, inject} */
  let quote = false;
  let para = [];

  const flushPara = () => { if (para.length) { out += '<p>' + inline(para.join('<br>')) + '</p>'; para = []; } };
  const closeQuote = () => { if (quote) { out += '</blockquote>'; quote = false; } };
  const closeLists = n => {
    while (stack.length > n) {
      const s = stack.pop();
      out += '</' + s.tag + '>';
      if (s.inject) out += '</li>';
    }
  };
  const flushAll = () => { closeQuote(); closeLists(0); flushPara(); };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const t = line.trim();

    /* 代码块占位 */
    const codeM = line.match(/^\u0000CODE(\d+)\u0000\s*$/);
    if (codeM) { flushAll(); out += '<pre><code>' + esc(blocks[+codeM[1]]) + '</code></pre>'; continue; }
    /* HTML 占位（figure / details） */
    const htmlM = line.match(/^\u0000HTML(\d+)\u0000\s*$/);
    if (htmlM) { flushAll(); out += htmls[+htmlM[1]]; continue; }

    /* 标题：1–4 级 */
    const h = t.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushAll(); out += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; continue; }

    /* 分隔线 */
    if (/^(-{3,}|\*{3,})$/.test(t)) { flushAll(); out += '<hr>'; continue; }

    /* 表格：当前行含 |，下一行是 |---|---| 分隔行 */
    if (t.indexOf('|') !== -1 && i + 1 < lines.length) {
      const sep = lines[i + 1].trim();
      if (/^[\s|:-]+$/.test(sep) && sep.indexOf('-') !== -1 && sep.indexOf('|') !== -1) {
        flushAll();
        const cellsOf = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        const aligns = cellsOf(sep).map(a =>
          a[0] === ':' && a[a.length - 1] === ':' ? 'center' :
          a[a.length - 1] === ':' ? 'right' : 'left');
        const mk = (c, k, tag2) =>
          '<' + tag2 + (aligns[k] ? ' style="text-align:' + aligns[k] + '"' : '') + '>'
          + inline(c) + '</' + tag2 + '>';
        const head = cellsOf(t).map((c, k) => mk(c, k, 'th')).join('');
        let rows = '', j = i + 2;
        while (j < lines.length && lines[j].trim().indexOf('|') !== -1) {
          rows += '<tr>' + cellsOf(lines[j]).map((c, k) => mk(c, k, 'td')).join('') + '</tr>';
          j++;
        }
        out += '<table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table>';
        i = j - 1;
        continue;
      }
    }

    /* 引用：esc 已把 > 转成 &gt;，按 &gt; 匹配；支持多行连续 */
    const q = t.match(/^&gt;\s?(.*)/);
    if (q) {
      flushPara(); closeLists(0);
      if (!quote) { out += '<blockquote>'; quote = true; }
      /* 外层「」交给 CSS 角标，正文里不用再写 */
      const qt = q[1].replace(/^「/, '').replace(/」$/, '');
      out += '<p>' + inline(qt) + '</p>';
      continue;
    }
    closeQuote();

    /* 列表：无序 / 有序 / 任务清单 / 长评段（*），支持任意层级嵌套
       注意：mUL[1] = 列表符号（- 或 *），mUL[2] = 内容 */
    const indent = line.replace(/\t/g, '  ').match(/^\s*/)[0].length;
    let tag = null, content = null, task = null, isStar = false;
    const mUL = t.match(/^([-*])\s+(.*)/);
    const mOL = t.match(/^\d+[.．]\s+(.*)/);
    if (mUL) {
      tag = 'ul';
      isStar = mUL[1] === '*';
      const tk = mUL[2].match(/^\[( |x|X)\]\s+(.*)$/);
      if (tk) { task = tk[1].toLowerCase() === 'x'; content = tk[2]; }
      else content = mUL[2];
    } else if (mOL) { tag = 'ol'; content = mOL[1]; }

    if (tag) {
      flushPara(); closeQuote();
      /* 关闭比当前更深的层级；同级但列表类型不同（ul↔ol 切换）也先关闭 */
      while (stack.length &&
            (stack[stack.length - 1].indent > indent ||
             (stack[stack.length - 1].indent === indent && stack[stack.length - 1].tag !== tag))) {
        closeLists(stack.length - 1);
      }
      /* 嵌套：把新列表挂进上一条 li 内 */
      let inject = false;
      if (stack.length && stack[stack.length - 1].indent < indent && out.slice(-5) === '</li>') {
        out = out.slice(0, -5);
        inject = true;
      }
      if (!stack.length || stack[stack.length - 1].indent < indent) {
        out += '<' + tag + '>';
        stack.push({ tag, indent, inject });
      }
      /* 输出条目 */
      if (task !== null) {
        out += '<li class="task"><input type="checkbox" disabled' + (task ? ' checked' : '') + '>' + inline(content) + '</li>';
      } else if (isStar && stack.length > 1) {
        /* 嵌套列表中的 * 条目 = 长评段 */
        out += '<li class="prose">' + inline(content) + '</li>';
      } else {
        out += '<li>' + inline(content) + '</li>';
      }
      continue;
    }
    closeLists(0);

    /* 空行 / 段落 */
    if (!t) { flushPara(); continue; }
    para.push(t);
  }
  flushAll();
  return out;
}


function parseEntry(id, raw, idx) {
  const lines = raw.split('\n');
  let title = '无题', start = 0;
  const m = lines[0] && lines[0].match(/^#\s+(.*)/);
  if (m) { title = m[1].trim(); start = 1; }
  const body = lines.slice(start).join('\n').replace(/^\s+/, '');

  let excerpt = '';
  for (let i = start; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) continue;
    if (t.startsWith('#')) continue;
    excerpt = t.replace(/^>\s?/, '').replace(/[*`>~\[\]!]/g, '').slice(0, 90);
    break;
  }
  return { id, title, excerpt, date: id, no: '第 ' + String(idx) + ' 期', body: body };
}

function fmtDate(id) {
  const parts = id.split('-');
  return '<span class="yr">' + parts[0] + '</span> ' + parts[1] + '.' + parts[2];
}
function fmtDateFull(id) {
  return id.replace(/-/g, ' · ');
}

function showIndex(kw, page) {
  kw = (kw || '').trim().toLowerCase();
  page = page || 1;

  const shown = kw
    ? entries.filter(e => (e.title + ' ' + e.excerpt + ' ' + e.body).toLowerCase().includes(kw))
    : entries;

  const totalPages = Math.max(1, Math.ceil(shown.length / PAGE_SIZE));
  page = Math.min(Math.max(1, page), totalPages);

  const start = (page - 1) * PAGE_SIZE;
  const slice = shown.slice(start, start + PAGE_SIZE);

  let html =
    '<div class="search">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      '<input type="search" id="q" placeholder="翻找旧页…" autocomplete="off" value="' + esc(kw || '') + '">' +
    '</div>' +
    '<div class="index-list">';

  for (let i = 0; i < slice.length; i++) {
    const e = slice[i];
    const isLatest = !kw && start === 0 && i === 0;   // 仅首页、未搜索时突出最新
    html +=
      '<a class="entry' + (isLatest ? ' entry-latest' : '') + '" href="#/' + e.id + '">' +
        '<div class="entry-date">' + fmtDate(e.date) + '<span class="entry-no">' + e.no + '</span></div>' +
        '<div class="entry-body">' +
          '<div class="entry-title">' + esc(e.title) + (isLatest ? '<span class="badge-new">最新</span>' : '') + '</div>' +
          (e.excerpt ? '<div class="entry-excerpt">' + esc(e.excerpt) + '…</div>' : '') +
        '</div>' +
      '</a>';
  }
  html += '</div>';

  if (totalPages > 1) {
    html +=
      '<nav class="pager">' +
        '<button id="pgPrev"' + (page <= 1 ? ' disabled' : '') + '>← 前一页</button>' +
        '<span class="pg-info">' + page + ' / ' + totalPages + '</span>' +
        '<button id="pgNext"' + (page >= totalPages ? ' disabled' : '') + '>后一页 →</button>' +
      '</nav>';
  }

  html += '<div class="empty" id="empty" style="display:' + (shown.length ? 'none' : 'block') + '">没有找到这一页</div>';

  /* ── 焦点保护：重渲染前记录输入框焦点状态和光标位置 ── */
  const oldQ = document.getElementById('q');
  const wasFocused = !!(oldQ && document.activeElement === oldQ);
  const selStart = wasFocused ? oldQ.selectionStart : null;
  const selEnd   = wasFocused ? oldQ.selectionEnd   : null;

  $('view').innerHTML = html;

  /* ── 渲染后恢复焦点 ── */
  if (wasFocused) {
    const input = $('q');
    if (input) {
      input.focus();
      try { input.setSelectionRange(selStart, selEnd); } catch (e) {}
    }
  }

  /* ── 分页按钮（每次渲染后重新绑定）── */
  const pgPrev = $('pgPrev'), pgNext = $('pgNext');
  if (pgPrev) pgPrev.onclick = () => { showIndex(kw, page - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  if (pgNext) pgNext.onclick = () => { showIndex(kw, page + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); };
}


function showPost(id) {
  const e = byId[id];
  if (!e) {
    $('view').innerHTML =
      '<p class="empty" style="display:block">这一页好像被撕掉了 <a href="#" onclick="location.hash=\'\';return false" style="color:var(--seal)">回目录</a></p>';
    return;
  }
  const idx = entries.indexOf(e);
  const prev = entries[idx + 1];
  const next = entries[idx - 1];

  $('view').innerHTML =
    '<a class="back" href="#">_ ← 回目录</a>' +
    '<article class="post">' +
      '<div class="post-head">' +
        '<div class="post-date">' + e.no + ' · ' + fmtDateFull(e.date) + '</div>' +
        '<h1 class="post-title">' + esc(e.title) + '</h1>' +
      '</div>' +
      '<div class="post-body">' + renderMD(e.body) + '</div>' +
      '<nav class="post-nav">' +
        (prev
          ? '<a class="prev" href="#/' + prev.id + '"><span class="lbl">← 更早</span>' + esc(prev.title) + '</a>'
          : '<span></span>') +
        (next
          ? '<a class="next" href="#/' + next.id + '"><span class="lbl">更新 →</span>' + esc(next.title) + '</a>'
          : '') +
      '</nav>' +
    '</article>';

  $('view').querySelectorAll('.post-body img').forEach(img => {
    img.style.cursor = 'zoom-in';
    img.onerror = () => {
      const d = document.createElement('div');
      d.className = 'img-broken';
      d.textContent = '〔图已失效' + (img.alt ? '：' + img.alt : '') + '〕';
      img.replaceWith(d);
    };
    img.onclick = () => { lbImg.src = img.src; lb.style.display = 'grid'; };
  });

  window.scrollTo(0, 0);
}

function route() {
  const m = location.hash.match(/^#\/([\w-]+)$/);
  if (m) showPost(m[1]);
  else showIndex('');
}

window.addEventListener('hashchange', route);
/* 搜索输入：事件委托，全站只挂一次 */
$('view').addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  if (e.isComposing) return;            // 中文输入法组词中，不打断
  clearTimeout(showIndex._t);
  showIndex._t = setTimeout(() => showIndex(e.target.value, 1), 120);
});
$('view').addEventListener('compositionend', e => {
  if (e.target.id === 'q') showIndex(e.target.value, 1);   // 组词结束立即刷新
});

const lb = $('lb'), lbImg = $('lbImg');
lb.onclick = () => lb.style.display = 'none';
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') lb.style.display = 'none';
});

fetch('entries.txt')
  .then(r => r.text())
  .then(txt => {
    const ids = txt.split('\n').map(s => s.trim()).filter(Boolean);
    return Promise.all(ids.map(id =>
      fetch('posts/' + id + '.md')
        .then(r => r.ok ? r.text() : Promise.reject(id))
        .then(raw => ({ id, raw }))
        .catch(() => null)
    ));
  })
  .then(list => {
    entries = list.filter(Boolean).map((x, i) => parseEntry(x.id, x.raw, i));
    entries.sort((a, b) => b.id.localeCompare(a.id));
    entries.forEach((e, i) => { e.no = '第 ' + (entries.length - i) + ' 期'; });
    byId = Object.fromEntries(entries.map(e => [e.id, e]));

    if (entries.length) {
      $('range').textContent =
        entries[entries.length - 1].date + ' — ' + entries[0].date;
    }
    route();
  })
  .catch(() => {
    $('view').innerHTML = '<p class="empty" style="display:block">速写本还是空的</p>';
  });

$('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
