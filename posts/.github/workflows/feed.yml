name: Generate RSS feed
on:
  push:
    branches: [main]
    paths: ['posts/**', 'entries.txt', 'gen-feed.js']
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 4'   # 每周四 UTC 22:00（北京时间周四 06:00）兜底跑一次
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node gen-feed.js https://www.jinmajue.top/journal/      # ← 改成实际站点地址
      - name: Commit feed.xml
        run: |
          git config user.name  "feed-bot"
          git config user.email "actions@github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "chore: update feed.xml"
          git push
